[package]
name = "pimalaya-cli"
description = "CLI utils for Pimalaya"
version = "0.3.1"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["pimalaya", "cli"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/pimalaya-cli/latest/pimalaya_cli"
repository = "https://github.com/pimalaya/cli"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["prompt", "imap", "smtp", "jmap", "caldav", "carddav", "wizard", "terminal", "build", "table", "spinner"]
prompt = ["dep:inquire", "dep:secrecy", "dep:thiserror"]
imap = ["wizard", "dep:secrecy"]
smtp = ["wizard", "dep:secrecy"]
jmap = ["wizard", "dep:secrecy"]
caldav = ["wizard", "dep:secrecy"]
carddav = ["wizard", "dep:secrecy"]
wizard = ["prompt"]
terminal = ["dep:anyhow", "dep:base64-codec", "dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:dirs", "dep:env_logger", "dep:serde", "dep:schemars", "dep:serde_json", "dep:shellexpand"]
build = ["dep:serde", "dep:toml"]
table = ["dep:comfy-table"]
spinner = ["dep:crossterm", "dep:ctrlc"]

[[example]]
name = "imap-wizard"
path = "examples/imap_wizard.rs"
required-features = ["wizard", "imap"]

[[example]]
name = "spinner"
path = "examples/spinner.rs"
required-features = ["spinner"]

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
base64-codec = { version = "0.1", default-features = false, features = ["alloc"], optional = true }
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help"], optional = true }
clap_complete = { version = "4.4", default-features = false, optional = true }
clap_mangen = { version = "0.3", default-features = false, optional = true }
comfy-table = { version = "8", default-features = false, features = ["tty"], optional = true }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "derive-more", "events", "windows"], optional = true }
ctrlc = { version = "3", default-features = false, features = ["termination"], optional = true }
dirs = { version = "7", default-features = false, optional = true }
env_logger = { version = "0.11", default-features = false, optional = true }
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy", "macros", "one-liners"], optional = true }
log = { version = "0.4", default-features = false }
schemars = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
secrecy = { version = "0.10", default-features = false, features = ["serde"], optional = true }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }
shellexpand = { version = "3.1", default-features = false, features = ["base-0"], optional = true }
thiserror = { version = "2", default-features = false, features = ["std"], optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"], optional = true }
